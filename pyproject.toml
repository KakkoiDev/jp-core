[project]
name = "jp-core"
version = "0.2.0"
description = "Canonical Japanese content and Japanese-specific tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "genanki>=0.13.1",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Text-to-speech generation. Volume normalisation and MP3 merging additionally
# shell out to `ffmpeg`, which is not pip-installable.
audio = ["edge-tts>=6.1.0"]
tts = ["edge-tts>=6.1.0"]
stt = []
web = []
anki = []
# UniDic-backed reading verification, used by consumers that check furigana
# against a morphological analyser rather than trusting the CSV.
morphology = ["fugashi>=1.3.0", "unidic-lite>=1.0.8"]
# Deterministic reading generation for Japanese source material.
generation = ["pykakasi>=2.3.0"]
all = [
    "edge-tts>=6.1.0",
    "fugashi>=1.3.0",
    "unidic-lite>=1.0.8",
    "pykakasi>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_core"]

[tool.hatch.build.targets.wheel.force-include]
"IMPLEMENTATIONS.toml" = "jp_core/implementations.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
