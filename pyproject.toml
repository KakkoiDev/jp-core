[project]
name = "jp-core"
version = "0.2.0"
description = "Canonical Japanese content and Japanese-specific tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "genanki>=0.13.1",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Text-to-speech generation. Volume normalisation and MP3 merging additionally
# shell out to `ffmpeg`, which is not pip-installable.
audio = ["edge-tts>=6.1.0"]
tts = ["edge-tts>=6.1.0"]
stt = []
web = []
anki = []
# Morphological analysis. UniDic backs reading *verification*, for consumers
# that check furigana against an analyser rather than trusting the CSV. IPADIC
# backs reading *generation*: UniDic segments by short unit word, so it hands
# back 日本 + 語 and 金曜 + 日, which is what you want when checking a reading
# morpheme by morpheme and not what you want when writing furigana, where the
# compound's own reading is the answer.
morphology = ["fugashi>=1.3.0", "unidic-lite>=1.0.8", "ipadic>=1.0.0"]
# The dictionary-free fallback for reading generation. Reads a kanji run in
# isolation, so it declines anything needing context — prefer morphology.
generation = ["pykakasi>=2.3.0"]
all = [
    "edge-tts>=6.1.0",
    "fugashi>=1.3.0",
    "unidic-lite>=1.0.8",
    "ipadic>=1.0.0",
    "pykakasi>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_core"]

[tool.hatch.build.targets.wheel.force-include]
"IMPLEMENTATIONS.toml" = "jp_core/implementations.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
